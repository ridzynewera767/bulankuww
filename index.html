<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<!-- 🔥 FIX ZOOM HP -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>sorry for you 💗</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html, body{
overflow-x:hidden;
touch-action: manipulation;
}

body{
background: linear-gradient(135deg,#ff4d88,#ff99cc,#ffc0cb);
font-family:'Quicksand',sans-serif;
color:white;
text-align:center;
}

/* SECTION */
section{
display:none;
width:100vw;
min-height:100vh;
padding:60px 20px;
position:relative;
}

.active{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

/* TEXT */
h1{
font-size:90px;
font-family:'Great Vibes',cursive;
margin-bottom:30px;
}

p{
font-size:38px;
line-height:1.8;
max-width:900px;
}

/* INPUT */
input{
font-size:28px;
padding:18px;
border-radius:12px;
border:none;
text-align:center;
width:250px;
margin-top:20px;
}

/* BUTTON */
button{
font-size:30px;
padding:18px 40px;
margin-top:25px;
border:none;
border-radius:18px;
background:white;
color:#ff1493;
font-weight:700;
cursor:pointer;
}

button:active{
transform:scale(0.95);
}

/* NEXT */
.next{
margin-top:60px;
font-size:34px;
text-decoration:underline;
cursor:pointer;
}

/* COUNTER */
.counter{
font-size:70px;
margin:25px;
font-weight:bold;
}

/* KISS */
.hearts{
font-size:100px;
cursor:pointer;
}

/* 💔 TOMBOL TIDAK FIX STABIL */
#noBtn{
position: fixed;
background:#ff4d6d;
color:white;
border-radius:18px;
transition:0.25s ease;
z-index:999;
}
</style>
</head>

<body>

<!-- PIN -->
<section id="pinSec" class="active">
<h1>hi buyyaan 💗</h1>
<p>masukin pin dulu ya, tahun lahir ak</p>

<input id="pinInput" placeholder="2010">
<button onclick="checkPin()">unlock</button>
</section>

<!-- MAIN -->
<section id="mainSec">
<h1>sorry 💗</h1>
<p>
aku minta maaf ya sayangcu...<br>
aku sadar aku banyak salah<br>
maafin aku yang sering ngecewain km ini ya🥺
</p>

<div class="next" onclick="toQuest()">next →</div>
</section>

<!-- QUEST -->
<section id="questSec">

<h1>quest 💗</h1>

<p>kamu mau maafin aku ga?</p>

<div>
<button onclick="toKiss()">iya 💗</button>

<button id="noBtn" onmouseover="kabur(this)">
tidak 💔
</button>
</div>

<p style="margin-top:120px;">tingkat kekesalan</p>

<div class="counter" id="angerCount">0</div>
<button onclick="addAnger()">klik 💢</button>

<div class="next" onclick="toKiss()">next →</div>

</section>

<!-- KISS -->
<section id="kissSec">
<h1>last 💗</h1>

<p>cium dulu dong buy😘</p>
<div class="hearts" onclick="kiss()">💋</div>
<div class="counter" id="kissCount">0</div>
</section>

<!-- MUSIC -->
<audio id="music" loop>
<source src="ssstik.io_1780138380446.mp3" type="audio/mp3">
</audio>

<script>
let anger = 0;
let kissCount = 0;
let kaburCooldown = false;

/* PIN */
function checkPin(){
let pin = document.getElementById("pinInput").value;

if(pin === "2010"){
document.getElementById("pinSec").classList.remove("active");
document.getElementById("mainSec").classList.add("active");

let music = document.getElementById("music");
music.play().catch(()=>{});

}else{
alert("pin salah 💔");
}
}

/* NAV */
function toQuest(){
document.getElementById("mainSec").classList.remove("active");
document.getElementById("questSec").classList.add("active");
}

function toKiss(){
document.getElementById("questSec").classList.remove("active");
document.getElementById("kissSec").classList.add("active");
}

/* ANGER */
function addAnger(){
if(anger < 10){
anger++;
document.getElementById("angerCount").innerText = anger;
}
}

/* KISS */
function kiss(){
if(kissCount < 10){
kissCount++;
document.getElementById("kissCount").innerText = kissCount;
}
}

/* 💔 KABUR STABIL */
function kabur(btn){

if(kaburCooldown) return;
kaburCooldown = true;

let padding = 100;

let x = Math.random() * (window.innerWidth - padding);
let y = Math.random() * (window.innerHeight - padding);

x = Math.max(20, x);
y = Math.max(20, y);

btn.style.left = x + "px";
btn.style.top = y + "px";

setTimeout(()=>{
kaburCooldown = false;
}, 180);
}
</script>

</body>
</html>
