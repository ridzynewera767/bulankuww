<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>sorry for you 💗</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background: linear-gradient(135deg,#ff4d88,#ff99cc,#ffc0cb);
font-family:'Quicksand',sans-serif;
color:white;
text-align:center;
overflow-x:hidden;
}

/* 🔥 INI KUNCINYA BIAR GAK KECIL */
section{
display:none;
width:100vw;
min-height:100vh;
padding:60px 20px;
}

.active{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

/* 💥 JUDUL SUPER BESAR */
h1{
font-size:90px;
font-family:'Great Vibes',cursive;
margin-bottom:30px;
}

/* 💥 TEKS BESAR */
p{
font-size:38px;
line-height:1.8;
max-width:900px;
}

/* INPUT PIN */
input{
font-size:28px;
padding:18px;
border-radius:12px;
border:none;
text-align:center;
width:250px;
margin-top:20px;
}

/* BUTTON */
button{
font-size:30px;
padding:18px 40px;
margin-top:25px;
border:none;
border-radius:18px;
background:white;
color:#ff1493;
font-weight:700;
cursor:pointer;
}

button:active{
transform:scale(0.95);
}

/* NEXT TOMBOL */
.next{
margin-top:60px;
font-size:34px;
text-decoration:underline;
cursor:pointer;
}

/* COUNTER */
.counter{
font-size:70px;
margin:25px;
font-weight:bold;
}

/* HEART / KISS */
.hearts{
font-size:100px;
cursor:pointer;
}

/* MOBILE FIX BIAR LEBIH GILA BESAR */
@media(max-width:768px){
h1{font-size:70px;}
p{font-size:34px;}
.counter{font-size:60px;}
}
</style>
</head>

<body>

<!-- PIN -->
<section id="pinSec" class="active">
<h1>hi bulan 💗</h1>
<p>masukin pin dulu buy,tahun lahir ak</p>

<input id="pinInput" placeholder="2010">
<button onclick="checkPin()">unlock</button>
</section>

<!-- MAIN -->
<section id="mainSec">
<h1>sorry 💗</h1>
<p>
aku minta maaf ya...<br>
aku sadar aku banyak salah<br>
maafin ak klo udh sring ngecewain ya buyancu🥺
</p>

<div class="next" onclick="toQuest()">next →</div>
</section>

<!-- QUEST -->
<section id="questSec">
<h1>quest 💗</h1>

<p>kamu maafin aku ga?</p>
<button onclick="toKiss()">iya 💗</button>

<p style="margin-top:50px;">tingkat kekesalan</p>
<div class="counter" id="angerCount">0</div>
<button onclick="addAnger()">klik 💢</button>

<div class="next" onclick="toKiss()">next →</div>
</section>

<!-- KISS -->
<section id="kissSec">
<h1>last 💗</h1>

<p>cium dulu buy 😜</p>
<div class="hearts" onclick="kiss()">💋</div>
<div class="counter" id="kissCount">0</div>
</section>

<!-- MUSIC -->
<audio id="music" loop>
<source src="ssstik.io_1780138380446.mp3" type="audio/mp3">
</audio>

<script>
let anger = 0;
let kissCount = 0;

function checkPin(){
let pin = document.getElementById("pinInput").value;

if(pin === "2010"){
document.getElementById("pinSec").classList.remove("active");
document.getElementById("mainSec").classList.add("active");

document.getElementById("music").play();

}else{
alert("pin salah 💔");
}
}

function toQuest(){
document.getElementById("mainSec").classList.remove("active");
document.getElementById("questSec").classList.add("active");
}

function toKiss(){
document.getElementById("questSec").classList.remove("active");
document.getElementById("kissSec").classList.add("active");
}

function addAnger(){
if(anger < 10){
anger++;
document.getElementById("angerCount").innerText = anger;
}
}

function kiss(){
if(kissCount < 10){
kissCount++;
document.getElementById("kissCount").innerText = kissCount;
}
}
</script>

</body>
</html>
